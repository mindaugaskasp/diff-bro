name: CI

# Lint + tests on every push and PR to main, so a broken build is caught before
# it can ever be tagged for release. The release workflow re-runs `npm run check`
# too, but this gives fast feedback and blocks merges.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Both platforms the app ships on. Windows is here because the release build
  # used to be the ONLY job that ran `npm run check` there, and v0.4.10 walked
  # into three Windows-only failures one tag at a time — a deprecation the
  # allowlist did not cover, a CRLF checkout that made a generated file read as
  # stale, and `npx` (a .cmd there) that execFileSync cannot spawn. None could
  # fail a PR. All three would have.
  #
  # macOS is deliberately NOT here: it shares Windows' nothing and the release
  # build covers it, so it would double the bill to re-prove what ubuntu does.
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      # Both report. The whole point is seeing WHICH platform broke, and a
      # cancelled sibling hides that.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11 --no-fund --no-audit
      # Captured so the guard below sees it. The guard used to run ONLY in the
      # release workflow, so a new upstream deprecation passed every PR and then
      # failed the tagged build — which is how v0.4.10 broke on a glob@10 notice
      # that had been in the tree since the i18n plugin landed.
      #
      # `shell: bash` because the pipe and 2>&1 are written for it; the Windows
      # runner would otherwise take this as PowerShell, where they do not mean
      # the same thing.
      - name: Install dependencies
        shell: bash
        run: npm ci --no-fund 2>&1 | tee npm-ci.log
      - name: Guard against unexpected install warnings
        shell: bash
        run: node scripts/check-install-warnings.mjs npm-ci.log
      - run: npm run check # ESLint + Vitest
      - run: npm run build # ensure it bundles

  # End-to-end tests drive the app's OWN Electron (Playwright `_electron`) under a
  # virtual display — no bundled browser, no network, same as the Docker test env.
  # 22.04 keeps the pre-t64 apt package names the app's Electron links against.
  #
  # E2E is the behavioural source of truth: it runs as the merge gate on pull
  # requests to main only (not on post-merge pushes — main is reached through a
  # PR). Make it a required status check in the branch-protection rule for main
  # so a red run blocks the merge.
  e2e:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    strategy:
      # Every shard reports: a cancelled sibling hides which slice actually broke.
      fail-fast: false
      matrix:
        # Playwright splits by FILE, the same axis the suite already parallelises
        # on, so a spec's internal order — which the relaunch tests depend on —
        # is preserved. Setup + build is ~1.2 min per shard and does not divide,
        # so past ~6 shards the fixed cost starts eating the gain.
        shard: [1, 2, 3, 4]
    env:
      # Never let Playwright pull Chromium/Firefox/WebKit — the suite uses none.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      # Container/CI switch: --no-sandbox + software rendering (see security.js).
      DIFFBRO_DOCKER: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11 --no-fund --no-audit
      - run: npm ci --no-fund
      # Electron 42 dropped the postinstall that used to fetch the binary: it now
      # downloads on the first `require('electron')`. Doing it HERE keeps that
      # download out of the first test (where it reads as a mystery timeout) and
      # out of electron-vite, which asks for the path and never triggers it.
      - name: Fetch the Electron binary
        run: node -e "require('electron')"
      # Electron's runtime libraries + Xvfb + a window manager — the same set the
      # Docker test env installs. openbox is NOT optional: unmanaged, the window
      # takes a different width and the diff panes split 571/572 instead of evenly.
      - name: Install Electron runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 libatspi2.0-0 \
            libdrm2 libgbm1 libasound2 libx11-xcb1 libxcb-dri3-0 libsecret-1-0 xvfb \
            openbox
      # One Xvfb per worker (:100 up) — the X11 clipboard is per-display, so
      # workers sharing one would read each other's copies. Not `xvfb-run`,
      # which starts a single display and owns DISPLAY itself.
      - name: Start a virtual display per worker
        run: bash scripts/e2e-displays.sh
      - name: Run end-to-end tests
        # job-total, not a literal: the shard count can only be wrong in one
        # place, and adding a shard to the matrix is the whole edit.
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}
      # Report + per-failure traces (with screenshots) for inspection after the run.
      - name: Upload Playwright report and traces
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
