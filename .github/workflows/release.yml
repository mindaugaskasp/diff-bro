name: Release

# Packaging is only run at release points, not on every push — build
# artifacts and asset uploads below are too expensive to run per-commit.
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  # Fail the whole release fast, on one cheap runner, if any known
  # vulnerability is present — before spending Windows/macOS build minutes.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11
      - run: npm ci
      # Blocks the release when npm audit finds a vulnerability at or above the
      # threshold. Audits against package-lock.json, i.e. the exact versions
      # that ship in CI. `moderate` covers the actionable set (moderate / high /
      # critical) while ignoring unfixable low-severity dev-tool noise; change
      # to `--audit-level=low` to fail on any advisory at all.
      - name: Audit dependencies for known vulnerabilities
        run: npm audit --audit-level=moderate

  # E2E is the behavioural source of truth. On PRs it's the merge gate (see
  # ci.yml); at release time we re-run it as a safety net so a tag can never
  # ship without it — a direct push to main or a tag on an arbitrary commit
  # would otherwise bypass the PR gate entirely. Same setup as ci.yml's e2e job.
  e2e:
    runs-on: ubuntu-22.04
    env:
      # Never let Playwright pull Chromium/Firefox/WebKit — the suite uses none.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      # Container/CI switch: --no-sandbox + software rendering (see security.js).
      DIFFBRO_DOCKER: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11
      - run: npm ci
      # Electron's runtime libraries + Xvfb (the same set the Docker test env installs).
      - name: Install Electron runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 libatspi2.0-0 \
            libdrm2 libgbm1 libasound2 libx11-xcb1 libxcb-dri3-0 libsecret-1-0 xvfb
      - name: Run end-to-end tests under Xvfb
        run: xvfb-run -a npm run test:e2e # electron-vite build && playwright test
      # Report + per-failure traces (with screenshots) for inspection after the run.
      - name: Upload Playwright report and traces
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  build:
    needs: [audit, e2e]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build-script: build:win
            installer-glob: dist/*.exe
          - os: macos-latest
            build-script: build:mac
            installer-glob: dist/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # package-lock.json is written by npm 11 (see Makefile's `install`
      # target / docker/Dockerfile) — Node's bundled npm 10 resolves
      # optional platform packages differently and `npm ci` then rejects the
      # lock as out of sync. One resolver everywhere.
      - run: npm install -g npm@11

      # Install with the output captured so the guard below can flag any
      # NEW deprecation / engine warnings (see scripts/check-install-warnings.mjs).
      - name: Install dependencies
        shell: bash
        run: npm ci 2>&1 | tee npm-ci.log

      - name: Guard against unexpected install warnings
        shell: bash
        run: node scripts/check-install-warnings.mjs npm-ci.log

      # Make the git tag authoritative for the app's reported version (About /
      # package.json) by writing it in before packaging. The installer FILENAME
      # is intentionally version-less (see electron-builder.yml artifactName) so
      # the "download latest" URLs stay stable, so this only affects the version
      # the app reports, not the filename. No commit here — this checkout is
      # disposable; the persistent bump back to the repo is the sync-version job.
      - name: Sync version to the release tag
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      # Lint + tests before spending build minutes on a packaged installer.
      - run: npm run check

      - run: npm run ${{ matrix.build-script }}

      - uses: actions/upload-artifact@v6
        with:
          name: installer-${{ matrix.os }}
          path: ${{ matrix.installer-glob }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    # Explicit here rather than relying on the repo's default token
    # permissions, which may be read-only.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: installers
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: installers/*
          # This app deliberately has no auto-update (see DEVELOPMENT_PLAN.md)
          # — installers are the only intended distribution path, so every
          # tag push is a real release, never a draft/prerelease.
          draft: false
          prerelease: false

  # Persist the released version back to the repo. The build job writes the tag
  # version into its DISPOSABLE checkout for packaging; this is the durable
  # counterpart, so package.json (and the lockfile) on the default branch always
  # reflect the latest release tag instead of drifting behind it. Runs only after
  # the release is actually published. `[skip ci]` keeps this trivial bump from
  # re-triggering the CI workflow. (If the default branch is protected against
  # direct pushes, allow github-actions[bot] to bypass it, or swap in a PAT.)
  sync-version:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: npm install -g npm@11

      # Only touches package.json + package-lock.json (no node_modules needed);
      # --allow-same-version makes a re-run a clean no-op.
      - name: Bump package.json and lockfile to the release tag
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Commit and push the bump if the version changed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "package.json already at ${GITHUB_REF_NAME#v} — nothing to commit."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m "chore: sync version to ${GITHUB_REF_NAME} [skip ci]"
          git push origin HEAD:"${{ github.event.repository.default_branch }}"

  # Keep the Homebrew cask in step with the release so `brew upgrade` works.
  # Regenerates the cask (version + sha256 of the just-released DMG) and pushes
  # it to the tap repo. Skips cleanly if HOMEBREW_TAP_TOKEN isn't configured, so
  # the release itself never fails on it.
  homebrew:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Regenerate the cask from the released DMG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Filename carries the version (electron-builder.yml artifactName),
          # so the pattern has to be built from the tag too.
          gh release download "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" --pattern "diff-bro-v${version}.dmg" --dir dist
          node scripts/gen-homebrew-cask.mjs "${version}" --dmg "dist/diff-bro-v${version}.dmg"

      - name: Publish the cask to the Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          # Tap repo holding the cask; users run `brew tap <owner>/<name>`. The
          # repo itself must be named `homebrew-<name>`.
          TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO || 'mindaugaskasp/homebrew-tap' }}
        run: |
          if [ -z "${TAP_TOKEN}" ]; then
            echo "HOMEBREW_TAP_TOKEN not set — skipping tap update."
            echo "Configure a PAT with write access to ${TAP_REPO} to enable it."
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" tap
          mkdir -p tap/Casks
          cp packaging/homebrew/diff-bro.rb tap/Casks/diff-bro.rb
          cd tap
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add Casks/diff-bro.rb
          git commit -m "diff-bro ${version}" || { echo 'cask unchanged'; exit 0; }
          git push
