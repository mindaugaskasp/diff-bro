name: Release

# Packaging is only run at release points, not on every push — build
# artifacts and asset uploads below are too expensive to run per-commit.
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  # Fail the whole release fast, on one cheap runner, if any known
  # vulnerability is present — before spending Windows/macOS build minutes.
  # E2E is the behavioural source of truth. On PRs it's the merge gate (see
  # ci.yml); at release time we re-run it as a safety net so a tag can never
  # ship without it — a direct push to main or a tag on an arbitrary commit
  # would otherwise bypass the PR gate entirely. Same setup as ci.yml's e2e job.
  e2e:
    runs-on: ubuntu-22.04
    strategy:
      # Every shard reports: a cancelled sibling hides which slice actually broke.
      fail-fast: false
      matrix:
        # Playwright splits by FILE, the same axis the suite already parallelises
        # on, so a spec's internal order — which the relaunch tests depend on —
        # is preserved. Setup + build is ~1.2 min per shard and does not divide,
        # so past ~6 shards the fixed cost starts eating the gain.
        shard: [1, 2, 3, 4]
    env:
      # Never let Playwright pull Chromium/Firefox/WebKit — the suite uses none.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      # Container/CI switch: --no-sandbox + software rendering (see security.js).
      DIFFBRO_DOCKER: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11 --no-fund --no-audit
      - run: npm ci --no-fund
      # Electron 42 dropped the postinstall that used to fetch the binary: it now
      # downloads on the first `require('electron')`. Doing it HERE keeps that
      # download out of the first test (where it reads as a mystery timeout) and
      # out of electron-vite, which asks for the path and never triggers it.
      - name: Fetch the Electron binary
        run: node -e "require('electron')"
      # Electron's runtime libraries + Xvfb + a window manager — the same set the
      # Docker test env installs. openbox is NOT optional: unmanaged, the window
      # takes a different width and the diff panes split 571/572 instead of evenly.
      - name: Install Electron runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 libatspi2.0-0 \
            libdrm2 libgbm1 libasound2 libx11-xcb1 libxcb-dri3-0 libsecret-1-0 xvfb \
            openbox
      # One Xvfb per worker (:100 up) — the X11 clipboard is per-display, so
      # workers sharing one would read each other's copies. Not `xvfb-run`,
      # which starts a single display and owns DISPLAY itself.
      - name: Start a virtual display per worker
        run: bash scripts/e2e-displays.sh
      - name: Run end-to-end tests
        # job-total, not a literal: the shard count can only be wrong in one
        # place, and adding a shard to the matrix is the whole edit.
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}
      # Report + per-failure traces (with screenshots) for inspection after the run.
      - name: Upload Playwright report and traces
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  # Lint, guards, unit tests and coverage — ONCE, on the cheapest runner, in
  # parallel with e2e. It used to run inside BOTH build jobs, where it was 47% of
  # the Windows job (246s of 520s) and bought nothing the other platform had not
  # already proved: nothing in `npm run check` is platform-specific by design,
  # and ci.yml runs it on ubuntu AND windows for every push to main, which is the
  # commit a tag points at.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Blocks the release when npm audit finds a vulnerability at or above the
      # threshold. `moderate` covers the actionable set (moderate / high /
      # critical) while ignoring unfixable low-severity dev-tool noise; change
      # to `--audit-level=low` to fail on any advisory at all.
      #
      # FIRST, and --package-lock-only: this reads the lock and needs no
      # node_modules at all. It used to be its own job that installed the whole
      # 872MB tree to run a one-second check. Here it still fails the release
      # before a single build minute is spent, ~15s in.
      - name: Audit dependencies for known vulnerabilities
        run: npm audit --package-lock-only --audit-level=moderate

      - run: npm install -g npm@11 --no-fund --no-audit
      - run: npm ci --no-fund
      - run: npm run check

  build:
    needs: [e2e, check]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build-script: build:win
            installer-glob: dist/*.exe
          - os: macos-latest
            build-script: build:mac
            installer-glob: dist/*.dmg
          # electron-builder.yml has carried the AppImage + deb config (with
          # its SUID-sandbox notes) since it was written — this row is what
          # actually builds it. Native runner: cross-building the deb from
          # another OS is unsupported.
          - os: ubuntu-latest
            build-script: build:linux
            installer-glob: |
              dist/*.AppImage
              dist/*.deb
    runs-on: ${{ matrix.os }}
    # Both default to a per-OS location under the home directory; pinning them
    # into the workspace gives actions/cache ONE path that means the same thing
    # on Windows and macOS.
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    steps:
      - uses: actions/checkout@v5

      # electron-builder re-downloaded the ~100MB Electron zip (plus winCodeSign
      # and nsis) on every single run. Keyed on the lockfile, so an Electron bump
      # misses and refetches rather than packaging a stale runtime.
      - name: Cache the Electron + electron-builder downloads
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache
          key: ${{ runner.os }}-ebuilder-${{ hashFiles('package-lock.json') }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # package-lock.json is written by npm 11 (see Makefile's `install`
      # target / docker/Dockerfile) — Node's bundled npm 10 resolves
      # optional platform packages differently and `npm ci` then rejects the
      # lock as out of sync. One resolver everywhere.
      - run: npm install -g npm@11 --no-fund --no-audit

      # Install with the output captured so the guard below can flag any
      # NEW deprecation / engine warnings (see scripts/check-install-warnings.mjs).
      - name: Install dependencies
        shell: bash
        run: npm ci --no-fund 2>&1 | tee npm-ci.log

      - name: Guard against unexpected install warnings
        shell: bash
        run: node scripts/check-install-warnings.mjs npm-ci.log

      # Make the git tag authoritative for the app's reported version (About /
      # package.json) by writing it in before packaging. Installer FILENAMES are
      # version-stamped from the same value (electron-builder.yml artifactName),
      # which is why the README links the releases page rather than a
      # /releases/latest/download shortcut. No commit here — this checkout is
      # disposable; the persistent bump back to the repo is the sync-version job.
      - name: Sync version to the release tag
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - run: npm run ${{ matrix.build-script }}

      - uses: actions/upload-artifact@v6
        with:
          name: installer-${{ matrix.os }}
          path: ${{ matrix.installer-glob }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    # Explicit here rather than relying on the repo's default token
    # permissions, which may be read-only.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: installers
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: installers/*
          # This app deliberately has no auto-update (see DEVELOPMENT_PLAN.md)
          # — installers are the only intended distribution path, so every
          # tag push is a real release, never a draft/prerelease.
          draft: false
          prerelease: false

  # Persist the released version back to the repo. The build job writes the tag
  # version into its DISPOSABLE checkout for packaging; this is the durable
  # counterpart, so package.json (and the lockfile) on the default branch always
  # reflect the latest release tag instead of drifting behind it. Runs only after
  # the release is actually published. `[skip ci]` keeps this trivial bump from
  # re-triggering the CI workflow.
  #
  # main is protected by a ruleset (PR-required, signatures, coverage), so the
  # push goes out as the "diff-bro version sync" GitHub App, which is on the
  # ruleset's Bypass list. The default GITHUB_TOKEN can't be bypass-listed, hence
  # the App. Needs repo secret SYNC_APP_PRIVATE_KEY (the App's .pem).
  sync-version:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Mint a token for the version-sync App
        uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: '4412629'
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: npm install -g npm@11 --no-fund --no-audit

      # Only touches package.json + package-lock.json (no node_modules needed);
      # --allow-same-version makes a re-run a clean no-op.
      - name: Bump package.json and lockfile to the release tag
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Commit and push the bump if the version changed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "package.json already at ${GITHUB_REF_NAME#v} — nothing to commit."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m "chore: sync version to ${GITHUB_REF_NAME} [skip ci]"
          git push origin HEAD:"${{ github.event.repository.default_branch }}"

  # Keep the Homebrew cask in step with the release so `brew upgrade` works.
  # Regenerates the cask (version + sha256 of the just-released DMG) and pushes
  # it to the tap repo. Skips cleanly if HOMEBREW_TAP_TOKEN isn't configured, so
  # the release itself never fails on it.
  homebrew:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Regenerate the cask from the released DMG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Filename carries the version (electron-builder.yml artifactName),
          # so the pattern has to be built from the tag too.
          gh release download "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" --pattern "diff-bro-v${version}.dmg" --dir dist
          node scripts/gen-homebrew-cask.mjs "${version}" --dmg "dist/diff-bro-v${version}.dmg"

      - name: Publish the cask to the Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          # Tap repo holding the cask; users run `brew tap <owner>/<name>`. The
          # repo itself must be named `homebrew-<name>`.
          TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO || 'mindaugaskasp/homebrew-tap' }}
        run: |
          if [ -z "${TAP_TOKEN}" ]; then
            echo "HOMEBREW_TAP_TOKEN not set — skipping tap update."
            echo "Configure a PAT with write access to ${TAP_REPO} to enable it."
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" tap
          mkdir -p tap/Casks
          cp packaging/homebrew/diff-bro.rb tap/Casks/diff-bro.rb
          cd tap
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add Casks/diff-bro.rb
          git commit -m "diff-bro ${version}" || { echo 'cask unchanged'; exit 0; }
          git push
