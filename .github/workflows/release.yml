name: Release

# Packaging is only run at release points, not on every push — build
# artifacts and asset uploads below are too expensive to run per-commit.
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build-script: build:win
            installer-glob: dist/*.exe
          - os: macos-latest
            build-script: build:mac
            installer-glob: dist/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # package-lock.json is written by npm 11 (see Makefile's `install`
      # target / docker/Dockerfile) — node-version 20's bundled npm 10
      # resolves optional platform packages differently and `npm ci` then
      # rejects the lock as out of sync. One resolver everywhere.
      - run: npm install -g npm@11

      - run: npm ci

      # electron-builder names installers from package.json's `version`, not
      # the git tag — so a v0.1.1 tag would otherwise ship "…Setup 0.1.0.exe".
      # Make the tag authoritative by writing its version into package.json
      # before packaging (no commit; CI checkout is disposable).
      - name: Sync version to the release tag
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      # Lint + tests before spending build minutes on a packaged installer.
      - run: npm run check

      - run: npm run ${{ matrix.build-script }}

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: ${{ matrix.installer-glob }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    # Explicit here rather than relying on the repo's default token
    # permissions, which may be read-only.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          # This app deliberately has no auto-update (see DEVELOPMENT_PLAN.md)
          # — installers are the only intended distribution path, so every
          # tag push is a real release, never a draft/prerelease.
          draft: false
          prerelease: false
