<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Notice</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="app.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div class="dk" data-theme="{{ theme }}" style="width: 480px; height: 72px; position: relative; background: var(--bg)">
  <div class="notice" role="status" style="top: 12px; display: flex; align-items: center; gap: 12px; white-space: nowrap">
    <span>{{ text }}</span>
    <sc-if value="{{ undo }}" hint-placeholder-val="{{ true }}"><button type="button" class="btn btn-sm">Undo</button></sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark","solar","neon","nord","sepia","dim","beacon","meridian","linen","bloom","nyan","matrix","contrast","volcano","amber","tide","ember","graphite","vector"],"default":"light"},"text":{"editor":"text","default":"Added Rollback to Snippets"},"undo":{"editor":"boolean","default":true},"$preview":{"width":480,"height":72}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'light', text: this.props.text ?? 'Added Rollback to Snippets', undo: this.props.undo ?? true };
  }
}
</script>
</body>
</html>
