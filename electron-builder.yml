appId: com.mindaugas.diffbro
productName: DiffBro
directories:
  output: dist
  # NB: our compiled output lives in build/, so point buildResources away
  # from electron-builder's default ("build"). icon.png here is auto-converted
  # to .ico / .icns at package time.
  buildResources: resources
files:
  - build/**
win:
  target:
    - nsis
mac:
  target:
    - dmg
  category: public.app-category.developer-tools
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
