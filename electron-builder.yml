appId: com.mindaugas.diffbro
productName: Diff Bro
directories:
  output: dist
  # NB: our compiled output lives in build/, so point buildResources away
  # from electron-builder's default ("build"). icon.png here is auto-converted
  # to .ico / .icns at package time.
  buildResources: resources
files:
  - build/**
# Ship the app inside an ASAR and flip the Electron fuses that harden the
# packaged binary (electron-builder rewrites the fuse bits at pack time, before
# any signing step, so the flipped bits are what gets signed):
#   runAsNode / enableNodeCliInspectArguments / enableNodeOptionsEnvironmentVariable
#     off  — stop `ELECTRON_RUN_AS_NODE=1 "Diff Bro.exe" script.js` from turning
#            the trusted, installed binary into a generic Node interpreter (a
#            LOLBin malware likes to hide behind).
#   onlyLoadAppFromAsar
#     on   — the runtime refuses to load app code from anywhere but the ASAR.
#   enableCookieEncryption
#     on   — at-rest encryption for the Chromium cookie store.
#
# enableEmbeddedAsarIntegrityValidation is deliberately OFF until we ship a
# real Developer ID signature + notarization. That fuse binds the ASAR hash to
# the app's code signature; on an unsigned / ad-hoc-signed build it makes a
# quarantined macOS app fail to launch as "Diff Bro is damaged" *even after*
# the user clears the quarantine flag. Turn it back on together with signing
# (DEVELOPMENT_PLAN.md Phase 3). `onlyLoadAppFromAsar` + the LOLBin fuses above
# are the load-integrity hardening that works without signing.
asar: true
electronFuses:
  runAsNode: false
  enableNodeCliInspectArguments: false
  enableNodeOptionsEnvironmentVariable: false
  onlyLoadAppFromAsar: true
  enableEmbeddedAsarIntegrityValidation: false
  enableCookieEncryption: true
  # Required on Apple silicon: patching the fuse wire rewrites the Electron
  # binary and thereby breaks the linker-signed ad-hoc signature it ships with.
  # `mac.identity: null` means electron-builder signs nothing afterwards, so
  # without this the shipped .app has a broken signature — arm64 macOS refuses
  # to launch it ("Diff Bro is damaged") and `codesign --verify` fails with
  # "code has no resources but signature indicates they must be present".
  # @electron/fuses re-signs the whole bundle ad-hoc right after flipping.
  resetAdHocDarwinSignature: true
win:
  target:
    - nsis
  # Space-free, version-stamped installer names. ${version} comes from
  # package.json, which release.yml rewrites from the git tag before packaging,
  # so the filename always matches the release it belongs to — a downloaded
  # installer is identifiable long after it leaves the release page.
  #
  # The trade-off: GitHub's /releases/latest/download/<name> shortcut needs a
  # filename that never changes, so it cannot be used any more. README links to
  # the releases page instead, and the Homebrew cask builds its URL from the
  # tag (see scripts/gen-homebrew-cask.mjs, which must stay in sync with the
  # mac name below).
  artifactName: diff-bro-Setup-v${version}.${ext}
mac:
  target:
    - dmg
  artifactName: diff-bro-v${version}.${ext}
  category: public.app-category.developer-tools
  # No Apple Developer cert yet (see DEVELOPMENT_PLAN.md Phase 3) — without
  # this, electron-builder searches the runner's keychain for a signing
  # identity and fails outright on CI instead of producing an unsigned DMG.
  identity: null
  # Keep AppKit from injecting its Dictation / Emoji & Symbols items into the
  # Edit menu (see disableInjectedMacMenuItems in src/main/menu.js) — in the
  # bundle this takes effect on first launch, before any user default is set.
  extendInfo:
    NSDisabledDictationMenuItem: true
    NSDisabledCharacterPaletteMenuItem: true
linux:
  target:
    - AppImage
    - deb
  category: Development
  # Deliberately no `executableArgs: --no-sandbox` here: the .deb ships
  # chrome-sandbox SUID and the AppImage falls back to Electron's namespace
  # sandbox, so the OS sandbox stays on (CLAUDE.md rule 1).
deb:
  # dpkg requires a "Name <email>" maintainer. Kept here rather than as an
  # `author` object in package.json so the address stays packaging metadata.
  maintainer: Mindaugas Kasparavičius <kasp.mindaugas@gmail.com>
dmg:
  # Set explicitly: relying on electron-builder's buildResources auto-detection
  # silently fell back to its stock 540x380 backdrop, producing a DMG that
  # built fine and looked wrong. background@2x.png beside it supplies retina.
  # Both are rendered from resources/dmg-background.svg — edit the SVG, never
  # the PNGs. These coordinates are the centres of the two drop wells
  # drawn in that artwork, so the icons land inside them; changing one without
  # the other leaves the icons floating.
  background: resources/background.png
  window:
    width: 640
    height: 400
  iconSize: 128
  contents:
    - x: 180
      y: 208
      type: file
    - x: 460
      y: 208
      type: link
      path: /Applications
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
