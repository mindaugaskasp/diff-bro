services:
  diffbro:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - '6080:6080' # noVNC — open http://localhost:6080/vnc.html
    volumes:
      # Live source for HMR inside the container
      - .:/app
      # Shadow the host's node_modules/build with container-local ones:
      # the Linux Electron binaries installed at image-build time must not
      # be mixed with Windows/macOS ones from the host.
      - node_modules:/app/node_modules
      - build:/app/build
    environment:
      - DIFFBRO_DOCKER=1
    # Chromium needs more shared memory than Docker's 64 MB default
    shm_size: 1gb

volumes:
  node_modules:
  build:
