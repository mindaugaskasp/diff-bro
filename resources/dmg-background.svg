<!-- Finder DMG backdrop. Colors are taken from the app's dark theme
     (style.css: --bg #0d1117, --bg-panel #161b22, --border #30363d,
     --text #e6edf3, --text-dim #8b949e) and the logo's cap gradient, so the
     installer window looks like the app it installs.

     640x400 at 1x; dmg-background@2x.png carries the retina copy. The icon
     positions in electron-builder.yml must stay in sync with the two drop
     wells drawn below. -->
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2735"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#388bfd" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <rect width="640" height="400" fill="url(#sky)"/>

  <!-- The app's signature: a green add line and a red delete line, kept far
       enough from the icon wells not to compete with them. -->
  <g opacity="0.13">
    <rect x="60"  y="54" width="120" height="9" rx="4.5" fill="#3fb950"/>
    <rect x="60"  y="72" width="76"  height="9" rx="4.5" fill="#3fb950"/>
    <rect x="460" y="54" width="120" height="9" rx="4.5" fill="#f85149"/>
    <rect x="460" y="72" width="94"  height="9" rx="4.5" fill="#f85149"/>
  </g>

  <text x="320" y="76" text-anchor="middle" fill="#e6edf3"
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Helvetica, Arial, sans-serif"
        font-size="26" font-weight="600" letter-spacing="0.5">Diff Bro</text>
  <text x="320" y="102" text-anchor="middle" fill="#8b949e"
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Helvetica, Arial, sans-serif"
        font-size="13.5">Drag the app into Applications to install</text>

  <!-- Drop wells: centers match the icon coordinates in electron-builder.yml
       (180,208 and 460,208). -->
  <rect x="112" y="140" width="136" height="136" rx="26" fill="#161b22"
        stroke="#30363d" stroke-width="1.5"/>
  <rect x="392" y="140" width="136" height="136" rx="26" fill="#161b22"
        stroke="#30363d" stroke-width="1.5" stroke-dasharray="7 6"/>

  <!-- No icon captions here: Finder draws the real filenames under both icons,
       and a second set would collide with them. -->
  <g stroke="url(#arrow)" stroke-width="4.5" stroke-linecap="round"
     stroke-linejoin="round" fill="none">
    <line x1="278" y1="208" x2="356" y2="208"/>
    <path d="M 344 195 L 358 208 L 344 221"/>
  </g>

  <text x="320" y="368" text-anchor="middle" fill="#586069"
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Helvetica, Arial, sans-serif"
        font-size="11.5" letter-spacing="0.4">Offline only · nothing leaves this machine</text>
</svg>
