<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- DiffBro — chill bro, diff-colored shades, shield check.
       Calm, dark, secure. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2735"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#388bfd"/>
      <stop offset="1" stop-color="#1f6feb"/>
    </linearGradient>
  </defs>

  <!-- app-icon tile -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)" stroke="#30363d" stroke-width="2"/>

  <!-- faint diff gutter in the background: calm nod to what the app does -->
  <g opacity="0.14">
    <rect x="40" y="44" width="54" height="8" rx="4" fill="#3fb950"/>
    <rect x="162" y="44" width="54" height="8" rx="4" fill="#f85149"/>
  </g>

  <!-- head -->
  <circle cx="122" cy="142" r="60" fill="#212b38" stroke="#3a4654" stroke-width="3"/>

  <!-- backwards cap -->
  <rect x="34" y="110" width="36" height="15" rx="7.5" fill="#1a5fd0"/>
  <path d="M 64 124 Q 64 78 122 78 Q 180 78 180 124 Z" fill="url(#cap)"/>
  <rect x="64" y="118" width="116" height="10" rx="5" fill="#1a5fd0"/>
  <circle cx="122" cy="80" r="5" fill="#58a6ff"/>

  <!-- sunglasses: left lens adds, right lens deletes -->
  <line x1="64" y1="142" x2="80" y2="142" stroke="#46515e" stroke-width="4"/>
  <line x1="164" y1="142" x2="180" y2="142" stroke="#46515e" stroke-width="4"/>
  <line x1="116" y1="140" x2="128" y2="140" stroke="#46515e" stroke-width="4"/>
  <rect x="78" y="128" width="40" height="29" rx="9" fill="#0b0f14" stroke="#46515e" stroke-width="2.5"/>
  <rect x="126" y="128" width="40" height="29" rx="9" fill="#0b0f14" stroke="#46515e" stroke-width="2.5"/>
  <g stroke="#3fb950" stroke-width="3.5" stroke-linecap="round">
    <line x1="92" y1="142.5" x2="104" y2="142.5"/>
    <line x1="98" y1="136.5" x2="98" y2="148.5"/>
  </g>
  <line x1="140" y1="142.5" x2="152" y2="142.5" stroke="#f85149" stroke-width="3.5" stroke-linecap="round"/>

  <!-- unbothered smile -->
  <path d="M 98 176 Q 122 189 146 176" fill="none" stroke="#e6edf3" stroke-width="4.5" stroke-linecap="round"/>

  <!-- diff check: sealed and verified -->
  <path d="M 196 158 L 224 169 V 190 Q 224 213 196 222 Q 168 213 168 190 V 169 Z"
        fill="#238636" stroke="#2ea043" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 183 189 L 193 199 L 210 180" fill="none" stroke="#ffffff" stroke-width="6"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
