<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Diff Bro — the shades are the diff.
       One dark visor split by a bright seam: added lines behind the left lens,
       removed behind the right, cap as a single arc. Deliberately no face,
       smile or badge — at 16px an icon has room for exactly one idea, and the
       silhouette here is three bands (cap, visor, colour) that survive it. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2735"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#388bfd"/>
      <stop offset="1" stop-color="#1f6feb"/>
    </linearGradient>
    <clipPath id="lensL"><rect x="52" y="136" width="70" height="60" rx="17"/></clipPath>
    <clipPath id="lensR"><rect x="134" y="136" width="70" height="60" rx="17"/></clipPath>
  </defs>

  <!-- app-icon tile -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)" stroke="#30363d" stroke-width="2"/>

  <!-- backwards cap: crown, strap band, button -->
  <path d="M 46 118 Q 46 56 128 56 Q 210 56 210 118 Z" fill="url(#cap)"/>
  <rect x="38" y="112" width="180" height="17" rx="8.5" fill="#1a5fd0"/>
  <circle cx="128" cy="58" r="6" fill="#58a6ff"/>

  <!-- visor -->
  <rect x="50" y="134" width="156" height="64" rx="19" fill="#0b0f14" stroke="#3a4654" stroke-width="4"/>
  <g clip-path="url(#lensL)">
    <rect x="52" y="136" width="70" height="60" fill="#0e2a16"/>
    <rect x="64" y="148" width="46" height="10" rx="5" fill="#3fb950"/>
    <rect x="64" y="166" width="32" height="10" rx="5" fill="#3fb950" opacity="0.62"/>
  </g>
  <g clip-path="url(#lensR)">
    <rect x="134" y="136" width="70" height="60" fill="#2d1214"/>
    <rect x="146" y="148" width="46" height="10" rx="5" fill="#f85149"/>
    <rect x="146" y="166" width="36" height="10" rx="5" fill="#f85149" opacity="0.62"/>
  </g>

  <!-- the seam: the one bright element, dividing the two panes -->
  <rect x="121" y="128" width="14" height="76" rx="7" fill="#58a6ff"/>
</svg>
