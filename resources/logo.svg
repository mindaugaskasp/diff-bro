<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- DiffBro — the "Shades-D": a monoline letter D wearing spectacles. The D
       owns the name; the two lenses joined by one bright seam are the two panes
       being compared. Warm cream on a soft charcoal tile, a single amber seam as
       the only bright element. One idea, legible from 1024px down to the dock. -->
  <defs>
    <radialGradient id="tile" cx="50%" cy="-8%" r="140%">
      <stop offset="0" stop-color="#332f26"/>
      <stop offset="0.72" stop-color="#171309"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#tile)"/>
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#sheen)"/>
  <rect x="9" y="9" width="238" height="238" rx="53" fill="none"
        stroke="#ffffff" stroke-opacity="0.06" stroke-width="1.5"/>

  <g transform="translate(7,18) scale(2.2)">
    <path d="M32 22 H50 A28 28 0 0 1 50 78 H32 Z" fill="none"
          stroke="#f4ede0" stroke-width="10" stroke-linejoin="round"/>
    <circle cx="45" cy="50" r="7.5" fill="#f4ede0"/>
    <circle cx="63" cy="50" r="7.5" fill="#f4ede0"/>
    <rect x="52" y="46" width="4" height="8" rx="2" fill="#e8a13a"/>
  </g>
</svg>
