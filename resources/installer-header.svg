<!-- Windows NSIS inner-page header strip (150x57). MUI draws this bitmap
     right-aligned on a white header, so the field is white and the mark tile
     sits at the right edge. Rendered to installerHeader.bmp by `npm run
     render:brand`. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 57" width="150" height="57">
  <defs>
    <radialGradient id="tile" cx="50%" cy="-8%" r="150%">
      <stop offset="0" stop-color="#332f26"/>
      <stop offset="0.72" stop-color="#171309"/>
    </radialGradient>
  </defs>

  <rect width="150" height="57" fill="#ffffff"/>

  <g transform="translate(101,8)">
    <rect x="0" y="0" width="41" height="41" rx="9" fill="url(#tile)"/>
    <g transform="translate(2.2,5.4) scale(0.365)">
      <path d="M32 22 H50 A28 28 0 0 1 50 78 H32 Z" fill="none"
            stroke="#f4ede0" stroke-width="12" stroke-linejoin="round"/>
      <circle cx="45" cy="50" r="8" fill="#f4ede0"/>
      <circle cx="63" cy="50" r="8" fill="#f4ede0"/>
      <rect x="51.5" y="45" width="5" height="10" rx="2.5" fill="#e8a13a"/>
    </g>
  </g>
</svg>
