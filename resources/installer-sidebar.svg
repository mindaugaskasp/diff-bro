<!-- Windows NSIS welcome/finish sidebar (164x314). Unlike the DMG backdrop this
     CAN be dark: it is a full-bleed image panel, and the installer draws its own
     black text on the white area to the right. Rendered to installerSidebar.bmp
     by `npm run render:brand`. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 164 314" width="164" height="314">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2619"/>
      <stop offset="0.55" stop-color="#1c180e"/>
      <stop offset="1" stop-color="#131009"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="70%">
      <stop offset="0" stop-color="#e8a13a" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#e8a13a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="164" height="314" fill="url(#panel)"/>
  <rect width="164" height="314" fill="url(#glow)"/>

  <g transform="translate(19,40) scale(1.15)">
    <path d="M32 22 H50 A28 28 0 0 1 50 78 H32 Z" fill="none"
          stroke="#f4ede0" stroke-width="10" stroke-linejoin="round"/>
    <circle cx="45" cy="50" r="7.5" fill="#f4ede0"/>
    <circle cx="63" cy="50" r="7.5" fill="#f4ede0"/>
    <rect x="52" y="46" width="4" height="8" rx="2" fill="#e8a13a"/>
  </g>

  <text x="82" y="168" text-anchor="middle" fill="#f4ede0"
        font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif"
        font-size="17" font-weight="700" letter-spacing="2.5">DIFF BRO</text>

  <rect x="70" y="180" width="24" height="2.5" rx="1.25" fill="#e8a13a"/>

  <text x="82" y="202" text-anchor="middle" fill="#a99a7f"
        font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif"
        font-size="9.5" letter-spacing="0.6">Offline diff viewer</text>

  <text x="82" y="298" text-anchor="middle" fill="#6a5f47"
        font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif"
        font-size="8" letter-spacing="1.4">NOTHING LEAVES THIS MACHINE</text>
</svg>
