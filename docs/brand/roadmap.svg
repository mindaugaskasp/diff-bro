<!-- Roadmap board for docs/roadmap.md. Hand-authored rather than generated: GitHub
     strips <style> and class attributes from markdown, so an SVG image is the only
     way a designed board renders inline. The plate commits to the dark warm field
     in both GitHub themes, the same idiom as resources/logo.svg and the installer
     sidebar. Track hues are real theme accents from src/renderer/src/utils/themes.js
     (Dim, Bloom, Neon, Beacon) — colour depth encodes sequence: solid now, faded
     later. Keep this in step with the items in docs/roadmap.md. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="Diff Bro roadmap — seven tracks: developer workflow (dependencies, compare a git revision, a conflicts list and three-way merge) shipped, spreadsheet · finance (amounts read as amounts, delta and net variance, reading a big diff, caps that announce themselves), diagrams, comparing more, signing, snippets (an editable rendered view for Markdown and Jira), OS integration (Open with)">
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#2f2a1c"/>
      <stop offset="1" stop-color="#16120a"/>
    </linearGradient>
    <radialGradient id="glow" cx="20%" cy="6%" r="62%">
      <stop offset="0" stop-color="#e8a13a" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#e8a13a" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="plate">
      <rect x="0" y="0" width="1200" height="700" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#plate)">
    <rect width="1200" height="700" fill="url(#field)"/>
    <rect width="1200" height="580" fill="url(#glow)"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="30" y="76" font-size="40" font-weight="700" letter-spacing="-1" fill="#f4ede0">Diff Bro <tspan fill="#d9a441">roadmap</tspan></text>
    <text x="31" y="104" font-size="14" fill="#a99a7f">Seven tracks. Depth of colour is sequence — solid first, faded last.</text>

    <rect x="1016" y="52" width="154" height="28" rx="14" fill="none" stroke="#f4ede0" stroke-opacity="0.22"/>
    <text x="1093" y="70" font-size="11" letter-spacing="1.8" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#a99a7f">V0.4.29 · PLANNED</text>

    <!-- ============ card 1 · spreadsheet ============ -->
    <rect x="30" y="150" width="273" height="260" rx="12" fill="#f6f0e4"/>
    <text x="45" y="188" font-size="15" font-weight="600" letter-spacing="-0.15" fill="#221e16">Spreadsheet · finance</text>
    <text x="288" y="188" font-size="12" text-anchor="end"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8d8168">4</text>
    <rect x="45" y="202" width="243" height="2" fill="#d9a441"/>

    <rect x="45" y="213" width="243" height="30" rx="5" fill="#d9a441"/>
    <text x="55" y="232" font-size="12.5" fill="#1c1710">Amounts read as amounts</text>

    <rect x="45" y="250" width="243" height="30" rx="5" fill="#d9a441"/>
    <text x="55" y="269" font-size="12.5" fill="#1c1710">Δ and net variance</text>

    <rect x="45" y="287" width="243" height="30" rx="5" fill="#e9ce9b"/>
    <text x="55" y="306" font-size="12.5" fill="#1c1710">Reading a big diff</text>

    <rect x="45" y="324" width="243" height="30" rx="5" fill="#e9ce9b"/>
    <text x="55" y="343" font-size="12.5" fill="#1c1710">Caps that announce themselves</text>

    <line x1="45" y1="372" x2="288" y2="372" stroke="#ddd0b6" stroke-dasharray="3 3"/>
    <text x="45" y="391" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8d8168">numfmt.js</text>

    <!-- ============ card 2 · diagrams ============ -->
    <rect x="319" y="150" width="273" height="186" rx="12" fill="#f6f0e4"/>
    <text x="334" y="188" font-size="15" font-weight="600" letter-spacing="-0.15" fill="#221e16">Diagrams</text>
    <text x="577" y="188" font-size="12" text-anchor="end"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8d8168">2</text>
    <rect x="334" y="202" width="243" height="2" fill="#b0446e"/>

    <rect x="334" y="213" width="243" height="30" rx="5" fill="#b0446e"/>
    <text x="344" y="232" font-size="12.5" fill="#fff">Sequence · gantt · pie</text>

    <rect x="334" y="250" width="243" height="30" rx="5" fill="#dda6bb"/>
    <text x="344" y="269" font-size="12.5" fill="#1c1710">Click a change to pan to it</text>

    <line x1="334" y1="298" x2="577" y2="298" stroke="#ddd0b6" stroke-dasharray="3 3"/>
    <text x="334" y="317" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8d8168">diagramUnion.js</text>

    <!-- ============ card 3 · comparing more ============ -->
    <rect x="608" y="150" width="273" height="186" rx="12" fill="#f6f0e4"/>
    <text x="623" y="188" font-size="15" font-weight="600" letter-spacing="-0.15" fill="#221e16">Comparing more</text>
    <text x="866" y="188" font-size="12" text-anchor="end"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8d8168">2</text>
    <rect x="623" y="202" width="243" height="2" fill="#22d3ee"/>

    <rect x="623" y="213" width="243" height="30" rx="5" fill="#22d3ee"/>
    <text x="633" y="232" font-size="12.5" fill="#1c1710">Folder compare</text>

    <rect x="623" y="250" width="243" height="30" rx="5" fill="#a9e6f2"/>
    <text x="633" y="269" font-size="12.5" fill="#1c1710">Image pairs</text>

    <line x1="623" y1="298" x2="866" y2="298" stroke="#ddd0b6" stroke-dasharray="3 3"/>
    <text x="623" y="317" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8d8168">a decision first</text>

    <!-- ============ card 4 · signing ============ -->
    <rect x="897" y="150" width="273" height="186" rx="12" fill="#f6f0e4"/>
    <text x="912" y="188" font-size="15" font-weight="600" letter-spacing="-0.15" fill="#221e16">Signing</text>
    <text x="1155" y="188" font-size="12" text-anchor="end"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8d8168">2</text>
    <rect x="912" y="202" width="243" height="2" fill="#4ade80"/>

    <rect x="912" y="213" width="243" height="30" rx="5" fill="#4ade80"/>
    <text x="922" y="232" font-size="12.5" fill="#1c1710">macOS Developer ID</text>

