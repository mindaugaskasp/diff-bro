<!-- Roadmap board for docs/roadmap.md. Hand-authored rather than generated: GitHub
     strips <style> and class attributes from markdown, so an SVG image is the only
     way a designed board renders inline. The plate commits to the dark warm field
     in both GitHub themes, the same idiom as resources/logo.svg and the installer
     sidebar. Track hues are real theme accents from src/renderer/src/utils/themes.js
     (Dim, Neon, Beacon) — colour depth encodes sequence: solid now, faded
     later. Keep this in step with the items in docs/roadmap.md. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="1200" height="580" role="img" aria-label="Diff Bro roadmap — three tracks: spreadsheet, onboarding, signing">
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#2f2a1c"/>
      <stop offset="1" stop-color="#16120a"/>
    </linearGradient>
    <radialGradient id="glow" cx="20%" cy="6%" r="62%">
      <stop offset="0" stop-color="#e8a13a" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#e8a13a" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="plate">
      <rect x="0" y="0" width="1200" height="580" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#plate)">
    <rect width="1200" height="580" fill="url(#field)"/>
    <rect width="1200" height="580" fill="url(#glow)"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="30" y="76" font-size="40" font-weight="700" letter-spacing="-1" fill="#f4ede0">Diff Bro <tspan fill="#d9a441">roadmap</tspan></text>
    <text x="31" y="104" font-size="14" fill="#a99a7f">Three tracks. Depth of colour is sequence — solid first, faded last.</text>

    <rect x="1016" y="52" width="154" height="28" rx="14" fill="none" stroke="#f4ede0" stroke-opacity="0.22"/>
    <text x="1093" y="70" font-size="11" letter-spacing="1.8" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#a99a7f">V0.4.4 · PLANNED</text>

    <!-- ============ card 1 · spreadsheet ============ -->
    <rect x="30" y="150" width="369" height="334" rx="12" fill="#f6f0e4"/>
    <text x="45" y="188" font-size="15" font-weight="600" letter-spacing="-0.15" fill="#221e16">Spreadsheet · finance</text>
    <text x="384" y="188" font-size="12" text-anchor="end"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8d8168">6</text>
    <rect x="45" y="202" width="339" height="2" fill="#d9a441"/>

    <rect x="45" y="213" width="339" height="30" rx="5" fill="#d9a441"/>
    <text x="55" y="232" font-size="12.5" fill="#1c1710">Row identity · key columns</text>

    <rect x="45" y="250" width="339" height="30" rx="5" fill="#d9a441"/>
    <text x="55" y="269" font-size="12.5" fill="#1c1710">Header row offset</text>

    <rect x="45" y="287" width="339" height="30" rx="5" fill="#e9ce9b"/>
    <text x="55" y="306" font-size="12.5" fill="#1c1710">Amounts read as amounts</text>

    <rect x="45" y="324" width="339" height="30" rx="5" fill="#e9ce9b"/>
    <text x="55" y="343" font-size="12.5" fill="#1c1710">Δ and net variance</text>

    <rect x="45" y="361" width="339" height="30" rx="5" fill="#f0dfc0"/>
    <text x="55" y="380" font-size="12.5" fill="#4f4634">Reading a big diff</text>

    <rect x="45" y="398" width="339" height="30" rx="5" fill="#f0dfc0"/>
    <text x="55" y="417" font-size="12.5" fill="#4f4634">Caps that announce themselves</text>

    <line x1="45" y1="446" x2="384" y2="446" stroke="#ddd0b6" stroke-dasharray="3 3"/>
    <text x="45" y="465" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8d8168">alignRows.js:72</text>

    <!-- ============ card 2 · onboarding ============ -->
    <rect x="415" y="150" width="369" height="223" rx="12" fill="#f6f0e4"/>
    <text x="430" y="188" font-size="15" font-weight="600" letter-spacing="-0.15" fill="#221e16">Onboarding</text>
    <text x="769" y="188" font-size="12" text-anchor="end"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8d8168">3</text>
    <rect x="430" y="202" width="339" height="2" fill="#22d3ee"/>

    <rect x="430" y="213" width="339" height="30" rx="5" fill="#22d3ee"/>
    <text x="440" y="232" font-size="12.5" fill="#1c1710">Sample comparison</text>

    <rect x="430" y="250" width="339" height="30" rx="5" fill="#97e3e9"/>
    <text x="440" y="269" font-size="12.5" fill="#1c1710">Coach marks</text>

    <rect x="430" y="287" width="339" height="30" rx="5" fill="#c7eae6"/>
    <text x="440" y="306" font-size="12.5" fill="#4f4634">What's new on upgrade</text>

    <line x1="430" y1="335" x2="769" y2="335" stroke="#ddd0b6" stroke-dasharray="3 3"/>
    <text x="430" y="354" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8d8168">App.vue:170</text>

    <!-- ============ card 3 · signing ============ -->
    <rect x="801" y="150" width="369" height="186" rx="12" fill="#f6f0e4"/>
    <text x="816" y="188" font-size="15" font-weight="600" letter-spacing="-0.15" fill="#221e16">Signing</text>
    <text x="1155" y="188" font-size="12" text-anchor="end"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8d8168">2</text>
    <rect x="816" y="202" width="339" height="2" fill="#4ade80"/>

    <rect x="816" y="213" width="339" height="30" rx="5" fill="#4ade80"/>
    <text x="826" y="232" font-size="12.5" fill="#1c1710">macOS Developer ID</text>

    <rect x="816" y="250" width="339" height="30" rx="5" fill="#d0ecce"/>
    <text x="826" y="269" font-size="12.5" fill="#4f4634">Windows — deferred</text>

    <line x1="816" y1="298" x2="1155" y2="298" stroke="#ddd0b6" stroke-dasharray="3 3"/>
    <text x="816" y="317" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8d8168">electron-builder.yml:80</text>

    <!-- ============ rail ============ -->
    <line x1="30" y1="510" x2="1170" y2="510" stroke="#f4ede0" stroke-opacity="0.14"/>

    <rect x="30" y="536" width="22" height="8" rx="3" fill="#d9a441"/>
    <text x="60" y="544" font-size="12.5" fill="#a99a7f">now</text>

    <rect x="110" y="536" width="22" height="8" rx="3" fill="#e9ce9b"/>
    <text x="140" y="544" font-size="12.5" fill="#a99a7f">next</text>

    <rect x="192" y="536" width="22" height="8" rx="3" fill="#f0dfc0"/>
    <text x="222" y="544" font-size="12.5" fill="#a99a7f">later</text>

    <text x="1170" y="544" font-size="12.5" text-anchor="end" fill="#a99a7f">Each card ends with the file the work starts from.</text>
  </g>
</svg>
