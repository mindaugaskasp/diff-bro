    <line x1="912" y1="298" x2="1155" y2="298" stroke="#ddd0b6" stroke-dasharray="3 3"/>
    <text x="912" y="317" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8d8168">electron-builder.yml:80</text>

    <!-- ============ card 5 · developer workflow (shipped) ============ -->
    <rect x="319" y="360" width="273" height="223" rx="12" fill="#f6f0e4"/>
    <text x="334" y="398" font-size="15" font-weight="600" letter-spacing="-0.15" fill="#221e16">Developer workflow</text>
    <text x="577" y="398" font-size="12" text-anchor="end"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8d8168">3</text>
    <rect x="334" y="412" width="243" height="2" fill="#6ed2c0"/>

    <rect x="334" y="423" width="243" height="30" rx="5" fill="#6ed2c0"/>
    <text x="344" y="442" font-size="12.5" fill="#1c1710">Dependencies · lockfiles</text>

    <rect x="334" y="460" width="243" height="30" rx="5" fill="#6ed2c0"/>
    <text x="344" y="479" font-size="12.5" fill="#1c1710">Compare a git revision</text>

    <rect x="334" y="497" width="243" height="30" rx="5" fill="#6ed2c0"/>
    <text x="344" y="516" font-size="12.5" fill="#1c1710">Merge: conflicts list + three-way</text>

    <line x1="334" y1="545" x2="577" y2="545" stroke="#ddd0b6" stroke-dasharray="3 3"/>
    <text x="334" y="564" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8d8168">utils/lockfile/</text>

    <!-- ============ card 6 · snippets (shipped) ============ -->
    <rect x="608" y="360" width="273" height="223" rx="12" fill="#f6f0e4"/>
    <text x="623" y="398" font-size="15" font-weight="600" letter-spacing="-0.15" fill="#221e16">Snippets</text>
    <text x="866" y="398" font-size="12" text-anchor="end"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8d8168">3</text>
    <rect x="623" y="412" width="243" height="2" fill="#22d3ee"/>

    <rect x="623" y="423" width="243" height="30" rx="5" fill="#22d3ee"/>
    <text x="633" y="442" font-size="12.5" fill="#1c1710">Rendered view is editable</text>

    <rect x="623" y="460" width="243" height="30" rx="5" fill="#22d3ee"/>
    <text x="633" y="479" font-size="12.5" fill="#1c1710">Markdown + Jira, one block tree</text>

    <rect x="623" y="497" width="243" height="30" rx="5" fill="#22d3ee"/>
    <text x="633" y="516" font-size="12.5" fill="#1c1710">Paste is text/plain only</text>

    <line x1="623" y1="545" x2="866" y2="545" stroke="#ddd0b6" stroke-dasharray="3 3"/>
    <text x="623" y="564" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8d8168">utils/domToBlocks.js</text>

    <!-- ============ card 7 · OS integration (shipped) ============ -->
    <rect x="897" y="360" width="273" height="223" rx="12" fill="#f6f0e4"/>
    <text x="912" y="398" font-size="15" font-weight="600" letter-spacing="-0.15" fill="#221e16">OS integration</text>
    <text x="1155" y="398" font-size="12" text-anchor="end"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8d8168">3</text>
    <rect x="912" y="412" width="243" height="2" fill="#b0446e"/>

    <rect x="912" y="423" width="243" height="30" rx="5" fill="#b0446e"/>
    <text x="922" y="442" font-size="12.5" fill="#fdf6f8">Open with, from Finder / Explorer</text>

    <rect x="912" y="460" width="243" height="30" rx="5" fill="#b0446e"/>
