    <line x1="912" y1="545" x2="1155" y2="545" stroke="#ddd0b6" stroke-dasharray="3 3"/>
    <text x="912" y="564" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#8d8168">main/cli.js · parseOpenWith</text>

    <!-- ============ rail ============ -->
    <line x1="30" y1="630" x2="1170" y2="630" stroke="#f4ede0" stroke-opacity="0.14"/>

    <rect x="30" y="656" width="22" height="8" rx="3" fill="#d9a441"/>
    <text x="60" y="664" font-size="12.5" fill="#a99a7f">now</text>

    <rect x="110" y="656" width="22" height="8" rx="3" fill="#e9ce9b"/>
    <text x="140" y="664" font-size="12.5" fill="#a99a7f">next</text>

    <rect x="192" y="656" width="22" height="8" rx="3" fill="#f0dfc0"/>
    <text x="222" y="664" font-size="12.5" fill="#a99a7f">later</text>

    <text x="1170" y="664" font-size="12.5" text-anchor="end" fill="#a99a7f">Each card ends with the file the work starts from.</text>
  </g>
</svg>
